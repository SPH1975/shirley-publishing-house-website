[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Temporary article access restrictions; remove when editorial review is complete.
[[redirects]]
  from = "/article-volume-1-issue-4-learner-engagement"
  to = "/article-temporarily-unavailable.html"
  status = 404
  force = true

[[redirects]]
  from = "/article-volume-1-issue-4-learner-engagement.html"
  to = "/article-temporarily-unavailable.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/uploads/journal-archive/volume-1-issue-4/roxanne-urzame-learner-engagement.pdf"
  to = "/article-temporarily-unavailable.html"
  status = 404
  force = true

[[redirects]]
  from = "/article-volume-1-issue-4-reading-comprehension"
  to = "/article-temporarily-unavailable.html"
  status = 404
  force = true

[[redirects]]
  from = "/article-volume-1-issue-4-reading-comprehension.html"
  to = "/article-temporarily-unavailable.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/uploads/journal-archive/volume-1-issue-4/mary-aguilar-reading-comprehension.pdf"
  to = "/article-temporarily-unavailable.html"
  status = 404
  force = true

[[redirects]]
  from = "/article-volume-1-issue-4-reading-motivation"
  to = "/article-temporarily-unavailable.html"
  status = 404
  force = true

[[redirects]]
  from = "/article-volume-1-issue-4-reading-motivation.html"
  to = "/article-temporarily-unavailable.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/uploads/journal-archive/volume-1-issue-4/elvira-guerrero-reading-motivation.pdf"
  to = "/article-temporarily-unavailable.html"
  status = 404
  force = true

[[redirects]]
  from = "/national-research-journal/open-access-policy"
  to = "/national-research-journal-open-access-policy.html"
  status = 200

[[redirects]]
  from = "/national-research-journal/digital-preservation"
  to = "/national-research-journal-digital-preservation.html"
  status = 200

[[redirects]]
  from = "/national-research-journal/peer-review-policy"
  to = "/national-research-journal-peer-review-policy.html"
  status = 200

[[redirects]]
  from = "/national-research-journal/author-guidelines"
  to = "/national-research-journal-author-guidelines.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*-data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*-data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cms-data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
